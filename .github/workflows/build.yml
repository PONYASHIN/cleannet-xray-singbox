name: Build GeoSite

on:
  schedule:
    # Каждый день в 04:17 UTC (избегаем начала часа — GitHub может задерживать)
    - cron: '17 4 * * *'
  workflow_dispatch:  # Кнопка ручного запуска

permissions:
  contents: write  # Разрешаем коммитить результаты обратно в репозиторий

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install certifi

      - name: Run build script
        run: python build_geosite.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geosite.dat srs/ data/
          git diff --staged --quiet || git commit -m "chore: rebuild geosite $(date -u +%F)"
          git push
